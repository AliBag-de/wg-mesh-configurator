services:
  wg-manager:
    build: .
    container_name: wg-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    # network_mode: host (Only use on Linux if host interface access is needed)
    cap_add:
      - NET_ADMIN
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - ./data:/app/data
      # Optional: Persist local storage if needed, though app is mostly stateless/browser-based
      # except for the read-only view of wg interfaces.
      # If you want to allow the app to READ config files (optional future feature):
      - /etc/wireguard:/etc/wireguard:ro
      - ./public:/app/public
